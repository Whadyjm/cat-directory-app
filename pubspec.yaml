name: cat_directory_app
description: "Directorio interactivo de razas de gatos usando la API de Catfact Ninja."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # ── State Management ──────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0

  # ── Routing ───────────────────────────────────────────────────
  go_router: ^15.1.2

  # ── HTTP Client ───────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Connectivity ──────────────────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── Cache & Offline Persistence ───────────────────────────────
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # ── Model Annotations (freezed / json_serializable) ───────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── UI Utilities ──────────────────────────────────────────────
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # ── Code Generation ───────────────────────────────────────────
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  hive_ce_generator: ^1.8.1

  # ── Testing ───────────────────────────────────────────────────
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
