name: cat_directory_app
description: "Directorio interactivo de razas de gatos usando la API de Catfact Ninja."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  go_router: ^15.1.2
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  hive_ce_generator: ^1.8.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
